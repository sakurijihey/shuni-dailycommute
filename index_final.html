<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>슈니 통학길</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
/* Layout: 흰 바탕에 가는 선과 점만 쓰는 미니멀 구성. 한 화면에 하나의 행동(보물 확인 → 통학길 입력 → 이동 → 한마디 → 지도). 색은 먹색 + 주황 한 가지. */
:root {
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --ink: #15171C;
  --mute: #6A707C;
  --line: #E1E4EA;
  --accent: #B43038;
  --accent-ink: #FFFFFF;
  --land: #EEF0F4;
  --water: #D9E1EE;
  --focus: #2457E6;
  --font: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0F12; --surface: #17191E; --ink: #ECEEF2; --mute: #99A0AD; --line: #2A2E37;
    --accent: #E4636B; --accent-ink: #1F070A; --land: #14161B; --water: #1D2638; --focus: #8FA8FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0F12; --surface: #17191E; --ink: #ECEEF2; --mute: #99A0AD; --line: #2A2E37;
  --accent: #E4636B; --accent-ink: #1F070A; --land: #14161B; --water: #1D2638; --focus: #8FA8FF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6;
  word-break: keep-all; overflow-wrap: break-word; line-break: strict;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { max-width: 640px; margin: 0 auto; display: grid; gap: 28px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h2 { font-size: 22px; font-weight: 500; line-height: 1.4; margin: 0; text-wrap: balance; }
.mark { font-size: 13px; font-weight: 500; color: var(--mute); letter-spacing: .08em; display: flex; align-items: center; gap: 8px; }
.mark::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.screen { display: grid; gap: 24px; }
.screen[hidden] { display: none; }
.hint { color: var(--mute); font-size: 13px; }

/* 1. 보물(응원 멘트) */
#s1 { min-height: min(70vh, 560px); align-content: center; }
.label { font-size: 12px; color: var(--mute); letter-spacing: .12em; }
.cheer { font-size: clamp(26px, 6.6vw, 38px); font-weight: 300; line-height: 1.45; margin: 0; text-wrap: balance; }
.rise { opacity: 0; transform: translateY(8px); }
.rise.on { opacity: 1; transform: none; transition: opacity .7s ease, transform .7s ease; }
.reveal { visibility: hidden; opacity: 0; transition: opacity .5s ease, visibility 0s linear .5s; }
.reveal.on { visibility: visible; opacity: 1; transition: opacity .5s ease; }

.btn { border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 500; background: var(--ink); color: var(--bg); min-height: 48px; }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.link { background: none; color: var(--mute); padding: 6px 4px; min-height: 0; font-weight: 400; text-decoration: underline; text-underline-offset: 3px; border-radius: 4px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }

/* 2. 입력 */
.form { display: grid; gap: 26px; }
.field { display: grid; gap: 8px; min-width: 0; }
.field > label, .field > .lab { font-size: 13px; font-weight: 500; color: var(--mute); }
input[type=text], input[type=number], textarea {
  width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 10px 2px; min-height: 46px; font-size: 16px;
}
input:focus, textarea:focus { border-bottom-color: var(--ink); outline: none; }
input:focus-visible, textarea:focus-visible { outline: none; border-bottom: 2px solid var(--focus); }
textarea { resize: vertical; min-height: 96px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
textarea:focus { border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; min-height: 42px; display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.mins { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.mins input { width: 92px; text-align: center; }
.err { color: #C62D12; font-size: 13px; min-height: 1.3em; margin: 0; }
:root[data-theme="dark"] .err { color: #FF8A70; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .err { color: #FF8A70; } }

/* 지도 */
.mapwrap { position: relative; border-radius: 14px; overflow: hidden; background: var(--land); height: clamp(300px, 52vh, 520px); }
.mapwrap.short { height: clamp(240px, 34vh, 340px); }
.mapwrap.tall { height: clamp(360px, 62vh, 600px); }
#mapHost { position: absolute; inset: 0; }
#mapHost canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.zoom { position: absolute; right: 10px; top: 10px; display: grid; gap: 6px; z-index: 2; }
.zoom[hidden] { display: none; }
.zoom button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 16px; line-height: 1; }
.maptag { position: absolute; left: 12px; top: 12px; z-index: 2; font-size: 13px; font-weight: 500; max-width: calc(100% - 70px); }
.maptag[hidden] { display: none; }
.sel { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 3; background: var(--surface); border-radius: 14px; padding: 16px 44px 16px 18px; display: grid; gap: 6px; box-shadow: 0 12px 28px -12px rgba(0, 0, 0, .35); }
.sel[hidden] { display: none; }
.sel .who { font-size: 12px; color: var(--mute); }
.sel .msg { font-size: 17px; font-weight: 500; margin: 0; overflow-wrap: anywhere; line-height: 1.5; }
.sel .song { font-size: 13px; color: var(--mute); overflow-wrap: anywhere; }
.sel .x { position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; border: 0; background: none; font-size: 16px; color: var(--mute); }
.notice { border-left: 2px solid var(--accent); padding: 2px 0 2px 12px; font-size: 13px; color: var(--mute); margin: 0; }
.notice[hidden] { display: none; }
.count { font-size: 14px; color: var(--mute); }
.count b { color: var(--ink); font-weight: 700; font-size: 20px; margin-right: 2px; }
.list { display: grid; padding: 0; margin: 0; list-style: none; }
.list li { border-top: 1px solid var(--line); }
.item { background: none; border: 0; padding: 16px 2px; display: grid; gap: 4px; text-align: left; width: 100%; border-radius: 6px; }
.item .top { font-size: 12px; color: var(--mute); display: flex; gap: 8px; flex-wrap: wrap; }
.item .top .tag { color: var(--accent); font-weight: 700; }
.item .m { margin: 0; overflow-wrap: anywhere; }
.item .s { font-size: 13px; color: var(--mute); overflow-wrap: anywhere; }
.item.on .m { font-weight: 700; }
.empty { color: var(--mute); padding: 20px 2px; }

/* 이동 모션 화면 */
.motion-cap { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 14px; color: var(--mute); }
.motion-cap b { color: var(--ink); font-weight: 500; }

/* 로딩: 통학 수단이 지나감 */
#sLoad { min-height: min(60vh, 440px); align-content: center; justify-items: stretch; }
.track { position: relative; height: 44px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; bottom: 6px; border-bottom: 1px solid var(--ink); }
.track .veh { position: absolute; bottom: 8px; left: 0; font-size: 28px; line-height: 1; will-change: transform; }
.track .dot { position: absolute; right: 0; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .track .veh { animation: pass 1.7s cubic-bezier(.45, 0, .55, 1) infinite; }
  @keyframes pass { from { left: -8%; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } to { left: 100%; opacity: 0; } }
  .screen:not(#s1) { animation: fade .3s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}
@media (prefers-reduced-motion: reduce) { .track .veh { left: 45%; } .rise, .reveal { transition: none !important; } }

/* 관리 */
.a-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.a-tools input[type=text] { flex: 1 1 180px; width: auto; }
.a-tools select { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px; min-height: 42px; font: inherit; color: var(--ink); }
.a-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 20px 16px; }
.a-stat { display: grid; gap: 2px; }
.a-v { font-size: 26px; font-weight: 300; line-height: 1.2; }
.a-l { font-size: 12px; color: var(--mute); }
.a-bars { display: grid; gap: 8px; }
.a-bar { display: grid; grid-template-columns: minmax(7em, 13em) 1fr 2.5em; gap: 10px; align-items: center; font-size: 13px; }
.a-bar i { display: block; height: 4px; background: var(--ink); border-radius: 2px; min-width: 2px; }
.a-bar span:last-child { color: var(--mute); text-align: right; }
.a-row { border-top: 1px solid var(--line); padding: 14px 2px; display: grid; gap: 4px; }
.a-row .top { font-size: 12px; color: var(--mute); display: flex; gap: 8px; flex-wrap: wrap; }
.a-row .m { margin: 0; overflow-wrap: anywhere; }
.a-row .s { font-size: 13px; color: var(--mute); overflow-wrap: anywhere; }
.a-row .del { justify-self: start; margin-top: 4px; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 5px 14px; font-size: 13px; color: var(--mute); min-height: 34px; }
.a-row .del.arm { border-color: var(--accent); color: var(--accent); font-weight: 700; }
#toAdmin[hidden] { display: none; }

/* 설문: 질문 하나당 한 화면 */
#sSurvey { min-height: min(72vh, 560px); align-content: start; gap: 22px; }
.qhead { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--mute); }
.qbar { flex: 1; height: 2px; background: var(--line); position: relative; }
.qbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); transition: width .3s ease; }
.qlead { margin: 0; font-size: 13px; color: var(--mute); }
.qlead[hidden] { display: none; }
.qbody { display: grid; gap: 10px; }
.opt { text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 14px; padding: 15px 16px; min-height: 54px; font-size: 16px; }
.opt[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.qbody textarea { min-height: 140px; }
</style>

</head>
<body>
<div id="app">
  <div class="mark">슈니 통학길</div>

  <section class="screen" id="s1">
    <div class="label rise" id="lab1">오늘의 보물</div>
    <p class="cheer rise" id="cheer" aria-live="polite"></p>
    <div class="row reveal" id="next1">
      <button class="btn" id="go2" type="button">내 통학길 남기기</button>
    </div>
  </section>

  <section class="screen" id="s2" hidden>
    <h2>어디서 출발해서,<br>뭘 타고 오셨나요?</h2>
    <div class="form">
      <div class="field">
        <label for="origin">출발지</label>
        <input type="text" id="origin" list="placeList" autocomplete="off" placeholder="역·동네 검색 (예: 수원, 일산, 강남)">
        <datalist id="placeList"></datalist>
        <span class="hint">목록에 없으면 지도를 눌러 대략적인 위치를 찍어주세요. 정확한 집 위치는 저장하지 않아요.</span>
      </div>
      <div class="mapwrap short" id="slot2"></div>
      <div class="field">
        <span class="lab" id="modeLab">이동수단</span>
        <div class="chips" id="modes" role="group" aria-labelledby="modeLab"></div>
      </div>
      <div class="field">
        <label for="mins">걸린 시간 (분)</label>
        <div class="mins">
          <input type="number" id="mins" inputmode="numeric" min="1" max="300" placeholder="40">
          <div class="chips" id="minQuick"></div>
        </div>
      </div>
      <p class="err" id="err2" role="alert"></p>
      <div class="row">
        <button class="btn accent" id="go3" type="button">완료</button>
        <button class="btn link" id="back1" type="button">처음으로</button>
      </div>
    </div>
  </section>

  <section class="screen" id="s3" hidden>
    <div class="motion-cap" id="cap3" aria-live="polite"></div>
    <div class="mapwrap tall" id="slot3"></div>
  </section>

  <section class="screen" id="sSurvey" hidden>
    <div class="qhead"><span id="qStep"></span><div class="qbar" aria-hidden="true"><i id="qFill"></i></div></div>
    <p class="qlead" id="qLead"></p>
    <h2 id="qT" tabindex="-1"></h2>
    <div id="qBody"></div>
    <p class="err" id="err3" role="alert"></p>
    <div class="row">
      <button class="btn accent" id="qNext" type="button">다음</button>
      <button class="btn link" id="qBack" type="button">이전</button>
    </div>
  </section>

  <section class="screen" id="sLoad" hidden>
    <div class="track" aria-hidden="true"><span class="veh" id="veh">🚇</span><span class="dot"></span></div>
    <p class="hint" role="status" style="margin:0;text-align:center">지도에 통학길을 그리는 중이에요</p>
  </section>

  <section class="screen" id="s4" hidden>
    <div class="row" style="justify-content:space-between">
      <h2>슈니들의 통학길</h2>
      <span class="row"><button class="btn link" id="toAdmin" type="button" hidden>관리</button><button class="btn ghost" id="again" type="button">다시 남기기</button></span>
    </div>
    <div class="count" id="count"></div>
    <p class="notice" id="notice" hidden></p>
    <div class="mapwrap" id="slot4">
      <div class="sel" id="sel" hidden></div>
    </div>
    <p class="hint" id="mapHint" style="margin:-12px 0 0">선이나 점을 누르거나, 아래 목록에서 슈니들의 한마디를 볼 수 있어요.</p>
    <ul class="list" id="list"></ul>
  </section>

  <section class="screen" id="sAdmin" hidden>
    <div class="row" style="justify-content:space-between">
      <h2>응답 관리</h2>
      <span class="row"><button class="btn link" id="adminOut" type="button" hidden>로그아웃</button><button class="btn link" id="adminBack" type="button">지도로</button></span>
    </div>
    <div id="adminGate"></div>
    <div id="adminMain" hidden class="screen">
      <div class="a-sum" id="adminSum"></div>
      <div class="a-bars" id="adminBars"></div>
      <div class="a-tools">
        <input type="text" id="adminQ" placeholder="한마디·출발지·닉네임 검색" aria-label="검색">
        <select id="adminMode" aria-label="이동수단 필터"><option value="">전체 수단</option></select>
        <button class="btn ghost" id="adminCsv" type="button">CSV 저장</button>
      </div>
      <p class="err" id="adminErr" role="alert"></p>
      <div class="count" id="adminCount"></div>
      <div id="adminList"></div>
    </div>
  </section>

  <div id="stash" hidden><div id="mapHost">
    <canvas id="cv" role="img" aria-label="수도권 지도 위에 슈니들의 통학 경로를 선으로 그린 그림"></canvas>
    <div class="zoom" id="zoom">
      <button type="button" id="zin" aria-label="확대">+</button>
      <button type="button" id="zout" aria-label="축소">−</button>
      <button type="button" id="zfit" aria-label="전체 보기">○</button>
    </div>
    <div class="maptag" id="maptag" hidden></div>
  </div></div>
</div>

    $('#toAdmin').hidden = !state.isAdmin;
    if (!db) { renderAll(false); renderAdmin(); return; }
    db.collection('commutes').orderBy('createdAt', 'desc').limit(300).onSnapshot(function (snap) {

    }, function () { state.dbDown = true; renderAll(false); renderAdmin(); });
  })();
})();
